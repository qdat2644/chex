version: "3.8"

services:
  chexpert-ai:
    build: .
    container_name: chexpert_web_workstation
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
    environment:
      - TORCH_HOME=/app/.torch
      - APP_ENV=production
      - PHI_HMAC_SECRET=chexpert_production_secret_key_salt_32bytes_required
      - CHEXPERT_CHECKPOINT=/app/checkpoints/chexpert_convnext_small.pt
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health | grep '\"model_loaded\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
