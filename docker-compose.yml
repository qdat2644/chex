version: "3.8"

services:
  chexpert-ai:
    build: .
    container_name: chexpert_web_workstation
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
    environment:
      - TORCH_HOME=/app/.torch
      - APP_ENV=production
      - PHI_HMAC_SECRET_FILE=/run/secrets/phi_hmac_secret
      - CHEXPERT_CHECKPOINT=/app/checkpoints/chexpert_convnext_small.pt
    secrets:
      - phi_hmac_secret
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health | grep '\"model_loaded\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

secrets:
  phi_hmac_secret:
    file: ./secrets/phi_hmac_secret.txt
