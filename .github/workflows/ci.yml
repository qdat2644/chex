name: Scientific Protocol & Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    name: Code Syntax & Compilability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check compilation
        run: |
          python -m compileall -q app/ scripts/ tests/

  unit-tests:
    name: Test Suite & Protocol Integrity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run Unit & Protocol Integrity Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  security:
    name: Security & Anti-Leakage Static Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for Unsafe weights_only=False in App Code
        run: |
          if grep -rn "weights_only=False" app/; then
            echo "ERROR: Unsafe weights_only=False detected in app codebase!"
            exit 1
          fi
          echo "weights_only=True check passed."
      - name: Scan for Secret Leaks & Prohibited Tokens
        run: |
          if grep -rnE "KAGGLE_TOKEN=|KGAT_|\"kaggle_key\"|google\.colab" --exclude="test_secret_leakage.py" .; then
            echo "ERROR: Potential secret or prohibited Colab import detected!"
            exit 1
          fi
          echo "Secret scanning passed."

  report-sync-check:
    name: Report & LaTeX Synchronization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify Documentation Sync
        run: |
          python scripts/sync_reports.py --check

  latex-build:
    name: LaTeX Document & Protocol Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live & latexmk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended
      - name: Compile LaTeX Documents
        run: |
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error docs/table_check.tex
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error docs/protocol.tex
      - name: Check for LaTeX Citation/Reference Warnings
        run: |
          if grep -Eqi "undefined citations|undefined references|Citation .* undefined|Reference .* undefined" docs/protocol.log; then
            echo "ERROR: Undefined LaTeX citation/reference detected in protocol.log!"
            exit 1
          fi
          echo "LaTeX compilation verification passed with zero undefined citations/references."
      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: latex-pdf-build
          path: |
            docs/table_check.pdf
            docs/protocol.pdf
      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: latex-build-logs
          path: docs/*.log
